# LOOPKEEPER facility-large (V4): "Lab Hall 01" modular data centre, ~60 m x 42 m interior (simulated, fictional).
# Layout (metres; x east, z south, y up; origin at the plan centre):
#   north  : mechanical room (x -30..-12) | Hall A (x -12..30)           z -21..-3
#   centre : service corridor + robot dock lane (x -30..30)               z  -3..3
#   south  : CDU zone (x -30..-12)         | Hall B (x -12..30)           z   3..21
#   yard   : outdoor heat-rejection boundary (chiller) north of the mechanical room, z -30..-21
# Solver-backed assets: 16 liquid-fed racks (zone A = Hall A pod, zone B = Hall B pod; 4 instrumented hero GPU racks + 12 aux).
# Everything else in the rack rows is an ARCHITECTURAL-CONTEXT cabinet (`context_cabinets` in /topology): drawn, no telemetry,
# no coolant connection, never a fault target. Hydraulic structure/ids are identical to facility-small (same pandapipes model).
facility:
  id: lab_01
  name: Lab Hall 01
  config_version: facility-large@0.1
  hash_geometry: true
  hall: {min_x: -30.0, max_x: 30.0, min_z: -21.0, max_z: 21.0, height: 6.0}
  site:
    bounds_min: [-31.0, 0.0, -30.0]
    bounds_max: [31.0, 6.0, 22.0]
    support_spacing_m: 3.0
    rooms:
      - {id: room_mech, name: Facility mechanical room, kind: mechanical, rect: [-30.0, -21.0, -12.0, -3.0]}
      - {id: room_cdu, name: CDU zone, kind: cdu, rect: [-30.0, 3.0, -12.0, 21.0]}
      - {id: hall_a, name: Server Hall A, kind: hall, rect: [-12.0, -21.0, 30.0, -3.0], zone_id: zone_a}
      - {id: hall_b, name: Server Hall B, kind: hall, rect: [-12.0, 3.0, 30.0, 21.0], zone_id: zone_b}
      - {id: corridor, name: Service corridor and robot dock lane, kind: corridor, rect: [-30.0, -3.0, 30.0, 3.0]}
      - {id: yard, name: Outdoor heat-rejection yard, kind: yard, exterior: true, rect: [-30.0, -30.0, -14.0, -21.0]}
    # axis x: wall runs along x at z=at; axis z: runs along z at x=at.  Doors are gaps (door_h_m high) in the wall.
    walls:
      - {id: wall_n, axis: x, at: -21.0, from: -30.0, to: 30.0, thickness: 0.4, exterior: true}
      - {id: wall_s, axis: x, at: 21.0, from: -30.0, to: 30.0, thickness: 0.4, exterior: true}
      - {id: wall_w, axis: z, at: -30.0, from: -21.0, to: 21.0, thickness: 0.4, exterior: true}
      - {id: wall_e, axis: z, at: 30.0, from: -21.0, to: 21.0, thickness: 0.4, exterior: true}
      - id: wall_corr_n
        axis: x
        at: -3.0
        from: -30.0
        to: 30.0
        thickness: 0.3
        doors:
          - {id: door_mech, from: -18.0, to: -15.5, connects: [room_mech, corridor]}
          - {id: door_a_w, from: -8.0, to: -5.5, connects: [hall_a, corridor]}
          - {id: door_a_e, from: 14.0, to: 16.5, connects: [hall_a, corridor]}
      - id: wall_corr_s
        axis: x
        at: 3.0
        from: -30.0
        to: 30.0
        thickness: 0.3
        doors:
          - {id: door_cdu, from: -18.0, to: -15.5, connects: [room_cdu, corridor]}
          - {id: door_b_w, from: -8.0, to: -5.5, connects: [hall_b, corridor]}
          - {id: door_b_e, from: 14.0, to: 16.5, connects: [hall_b, corridor]}
      - id: wall_mech_hall_a
        axis: z
        at: -12.0
        from: -21.0
        to: -3.0
        thickness: 0.3
        doors:
          - {id: door_mech_a, from: -12.0, to: -10.0, connects: [room_mech, hall_a]}
      - id: wall_cdu_hall_b
        axis: z
        at: -12.0
        from: 3.0
        to: 21.0
        thickness: 0.3
        doors:
          - {id: door_cdu_b, from: 6.0, to: 8.0, connects: [room_cdu, hall_b]}
    door_h_m: 2.4
    columns:
      x: [-27.0, -12.0, 0.0, 12.0, 24.0]
      z: [-21.0, -3.0, 3.0, 21.0]
      size_m: [0.4, 6.0, 0.4]
  rack: {w: 1.0, h: 2.3, d: 1.3}
  row_z: {a: -16.0, b: 16.0}
  # cabinet rows: solver racks sit at the start of rows a1 / b1 (the liquid-cooled AI pods); every other slot is context only
  rows:
    - {id: row_a1, zone: a, hall: hall_a, z: -16.0, yaw_rad: 0.0, x0: -4.0, pitch: 1.1, count: 24, role: "AI pod row"}
    - {id: row_a2, zone: a, hall: hall_a, z: -11.5, yaw_rad: 3.141592653589793, x0: -4.0, pitch: 1.1, count: 24, role: "General compute row"}
    - {id: row_b1, zone: b, hall: hall_b, z: 16.0, yaw_rad: 3.141592653589793, x0: -4.0, pitch: 1.1, count: 24, role: "AI pod row"}
    - {id: row_b2, zone: b, hall: hall_b, z: 11.5, yaw_rad: 0.0, x0: -4.0, pitch: 1.1, count: 24, role: "General compute row"}
  aisle_service_z: {a: -13.75, b: 13.75}
  y_sup: 3.1
  y_ret: 2.75
  fillet_m: 0.28
  sup_z: {a: -16.2, b: 16.2}
  ret_z: {a: -16.55, b: 16.55}
  not_passable_reason: "Bore ≤ 40 mm — too small for any crawler. Inspect from outside only."
  limits: {chip_limit_c: 90, margin_warn_k: 11, margin_crit_k: 5, nominal_rack_kw: 120}
  racks:
    - {id: a1, zone: a, x: -4.0, supply_drop: 13, return_drop: 23}
    - {id: a2, zone: a, x: -2.9, supply_drop: 14, return_drop: 24}
    - {id: b1, zone: b, x: -4.0, supply_drop: 18, return_drop: 28}
    - {id: b2, zone: b, x: -2.9, supply_drop: 19, return_drop: 29}
  aux_racks:
    - {id: a3, zone: a, x: -1.8, kw: 5, role: "Network fabric", supply_drop: 31, return_drop: 41}
    - {id: a4, zone: a, x: -0.7, kw: 8, role: "Storage", supply_drop: 32, return_drop: 42}
    - {id: a5, zone: a, x: 0.4, kw: 11, role: "CPU / inference", supply_drop: 33, return_drop: 43}
    - {id: a6, zone: a, x: 1.5, kw: 5, role: "Network fabric", supply_drop: 34, return_drop: 44}
    - {id: a7, zone: a, x: 2.6, kw: 8, role: "Storage", supply_drop: 35, return_drop: 45}
    - {id: a8, zone: a, x: 3.7, kw: 11, role: "CPU / inference", supply_drop: 36, return_drop: 46}
    - {id: b3, zone: b, x: -1.8, kw: 8, role: "Storage", supply_drop: 51, return_drop: 61}
    - {id: b4, zone: b, x: -0.7, kw: 11, role: "CPU / inference", supply_drop: 52, return_drop: 62}
    - {id: b5, zone: b, x: 0.4, kw: 5, role: "Network fabric", supply_drop: 53, return_drop: 63}
    - {id: b6, zone: b, x: 1.5, kw: 8, role: "Storage", supply_drop: 54, return_drop: 64}
    - {id: b7, zone: b, x: 2.6, kw: 11, role: "CPU / inference", supply_drop: 55, return_drop: 65}
    - {id: b8, zone: b, x: 3.7, kw: 5, role: "Network fabric", supply_drop: 56, return_drop: 66}
  zones:
    - {id: zone_a, name: Hall A, anchor: [8.0, 0, -16.0]}
    - {id: zone_b, name: Hall B, anchor: [8.0, 0, 16.0]}
  nodes:
    - [n_fws_chiller_s, Chiller supply (plant boundary), fws, [-23.5, 2.0, -24.5]]
    - [n_fws_pump, FWS pump skid, fws, [-23.5, 0.9, -13.0]]
    - [n_cdu_fs, CDU primary in, fws, [-22.3, 0.9, 7.8]]
    - [n_cdu_fr, CDU primary out, fws, [-21.7, 0.9, 7.8]]
    - [n_fws_chiller_r, Chiller return (plant boundary), fws, [-21.7, 2.0, -24.5]]
    - [n_cdu_ts, CDU secondary out, tcs, [-21.35, 1.5, 8.55]]
    - [n_js, Supply junction, tcs, [-10.0, 3.1, -0.45]]
    - [n_a_s_end, Hall A supply end, tcs, [4.3, 3.1, -16.2]]
    - [n_b_s_end, Hall B supply end, tcs, [4.3, 3.1, 16.2]]
    - [n_cdu_tr, CDU secondary in, tcs, [-21.35, 1.5, 9.45]]
    - [n_jr, Return junction, tcs, [-10.6, 2.75, 0.45]]
    - [n_a_r_end, Hall A return end, tcs, [4.3, 2.75, -16.55]]
    - [n_b_r_end, Hall B return end, tcs, [4.3, 2.75, 16.55]]
  edges:
    - {id: p_01, name: "FWS supply · chiller to pump skid", loop: fws, role: supply, from: n_fws_chiller_s, to: n_fws_pump, dn: 200, passable: true, ports: [port_a1], pts: [[-23.5, 2.0, -24.5], [-23.5, 3.9, -24.5], [-23.5, 3.9, -13.0], [-23.5, 0.9, -13.0]]}
    - {id: p_02, name: "FWS supply · skid to CDU", loop: fws, role: supply, from: n_fws_pump, to: n_cdu_fs, dn: 200, passable: true, ports: [port_s1], pts: [[-23.5, 0.9, -13.0], [-23.5, 0.9, -10.0], [-23.5, 3.9, -10.0], [-23.5, 3.9, 5.5], [-23.5, 0.9, 5.5], [-22.3, 0.9, 5.5], [-22.3, 0.9, 7.8]]}
    - {id: p_03, name: "FWS return · CDU to chiller", loop: fws, role: return, from: n_cdu_fr, to: n_fws_chiller_r, dn: 200, passable: true, ports: [port_fr1], pts: [[-21.7, 0.9, 7.8], [-21.7, 0.9, 6.4], [-21.7, 3.6, 6.4], [-21.7, 3.6, -24.5], [-21.7, 2.0, -24.5]]}
    - {id: p_10, name: "TCS supply trunk", loop: tcs, role: supply, from: n_cdu_ts, to: n_js, dn: 150, passable: true, ports: [port_a2], pts: [[-21.35, 1.5, 8.55], [-18.0, 1.5, 8.55], [-18.0, 3.1, 8.55], [-18.0, 3.1, -0.45], [-10.0, 3.1, -0.45]]}
    - {id: p_12, name: "Hall A supply header", loop: tcs, role: supply, zone_id: zone_a, from: n_js, to: n_a_s_end, dn: 100, passable: true, ports: [port_as1, port_as2], pts: [[-10.0, 3.1, -0.45], [-10.0, 3.1, -16.2], [4.3, 3.1, -16.2]]}
    - {id: p_17, name: "Hall B supply header", loop: tcs, role: supply, zone_id: zone_b, from: n_js, to: n_b_s_end, dn: 100, passable: true, ports: [port_b1], pts: [[-10.0, 3.1, -0.45], [-10.0, 3.1, 16.2], [4.3, 3.1, 16.2]]}
    - {id: p_20, name: "TCS return trunk", loop: tcs, role: return, from: n_jr, to: n_cdu_tr, dn: 150, passable: true, ports: [port_res], pts: [[-10.6, 2.75, 0.45], [-16.5, 2.75, 0.45], [-16.5, 2.75, 9.45], [-16.5, 1.5, 9.45], [-21.35, 1.5, 9.45]]}
    - {id: p_22, name: "Hall A return header", loop: tcs, role: return, zone_id: zone_a, from: n_a_r_end, to: n_jr, dn: 100, passable: true, ports: [port_ar1, port_ar2], pts: [[4.3, 2.75, -16.55], [-10.6, 2.75, -16.55], [-10.6, 2.75, 0.45]]}
    - {id: p_27, name: "Hall B return header", loop: tcs, role: return, zone_id: zone_b, from: n_b_r_end, to: n_jr, dn: 100, passable: true, ports: [port_br1], pts: [[4.3, 2.75, 16.55], [-10.6, 2.75, 16.55], [-10.6, 2.75, 0.45]]}
  cdu:
    position: [-22.0, 0, 9.0]
    size: [1.3, 2.2, 2.4]
    service: [-22.0, 0, 11.6]
    spec: {Capacity: 600 kW, Heat exchanger: Brazed plate, Primary: FWS (facility water), Secondary: TCS (PG25)}
  chiller:
    position: [-22.0, 0, -26.0]
    size: [5.2, 2.2, 3.0]
    spec: {Supply setpoint: 27 °C, Note: Outdoor heat-rejection yard (plant boundary)}
  # [id, label, name, loop, position, edge, service]
  pumps:
    - [pump_t1, TCS-PMP-1, TCS circulation pump · duty, tcs, [-19.0, 0, 6.2], p_10, [-16.8, 0, 5.5]]
    - [pump_t2, TCS-PMP-2, TCS circulation pump · standby, tcs, [-19.0, 0, 4.8], p_10, [-16.8, 0, 5.5]]
    - [pump_f1, FWS-PMP-1, FWS pump · duty, fws, [-25.5, 0, -11.0], p_01, [-21.9, 0, -11.8]]
    - [pump_f2, FWS-PMP-2, FWS pump · standby, fws, [-25.5, 0, -12.6], p_01, [-21.9, 0, -11.8]]
  strainers:
    - {id: strainer_01, label: S-01, name: FWS Y-strainer, loop: fws, edge: p_02, s: 2.0, service: [-21.9, 0, -10.6], spec: {Mesh: 1.5 mm, Service: Basket exchange}}
    - {id: strainer_02, label: S-02, name: TCS basket strainer, loop: tcs, edge: p_10, s: 2.5, service: [-19.4, 0, 10.9], spec: {Mesh: 0.8 mm, Service: Basket exchange}}
  zone_valves:
    - {id: valve_za, label: V-ZA, name: Hall A isolation valve, zone: zone_a, edge: p_12, s: 4.0, service: [-8.8, 0, -5.0]}
    - {id: valve_zb, label: V-ZB, name: Hall B isolation valve, zone: zone_b, edge: p_17, s: 4.0, service: [-8.8, 0, 5.2]}
  meters:
    - {id: sn_flow_trunk, label: FM-10, name: TCS trunk flow meter, loop: tcs, edge: p_10, s: 9.0, service: [-17.0, 0, 4.0]}
    - {id: sn_flow_za, label: FM-12, name: Hall A flow meter, loop: tcs, edge: p_12, s: 6.5, service: [-8.8, 0, -7.0]}
    - {id: sn_flow_zb, label: FM-17, name: Hall B flow meter, loop: tcs, edge: p_17, s: 6.5, service: [-8.8, 0, 7.4]}
  # crawler launch / service ports (all on robot-passable edges). `slot` documents the intended INPIPE staging role.
  ports:
    - {id: port_as1, label: PORT-A-S1, name: Hall A supply service port 1, loop: tcs, edge: p_12, s: 7.0, slot: hall_a_supply}
    - {id: port_as2, label: PORT-A-S2, name: Hall A supply service port 2, loop: tcs, edge: p_12, s: 24.0, slot: hall_a_supply}
    - {id: port_ar1, label: PORT-A-R1, name: Hall A return inspection port 1, loop: tcs, edge: p_22, s: 6.0, slot: hall_a_return}
    - {id: port_ar2, label: PORT-A-R2, name: Hall A return inspection port 2, loop: tcs, edge: p_22, s: 22.0, slot: hall_a_return}
    - {id: port_b1, label: PORT-B-S1, name: Hall B supply inspection port, loop: tcs, edge: p_17, s: 8.0, slot: hall_b}
    - {id: port_br1, label: PORT-B-R1, name: Hall B return inspection port, loop: tcs, edge: p_27, s: 8.0, slot: hall_b}
    - {id: port_a1, label: PORT-M1, name: FWS mechanical-room launch port, loop: fws, edge: p_01, s: 12.0, slot: mechanical}
    - {id: port_a2, label: PORT-C1, name: TCS trunk launch port at CDU, loop: tcs, edge: p_10, s: 1.5, slot: cdu}
    - {id: port_s1, label: PORT-S1, name: FWS strainer inspection port, loop: fws, edge: p_02, s: 2.8, slot: strainer}
    - {id: port_res, label: PORT-RES, name: Crawler reserve staging bay, loop: tcs, edge: p_20, s: 8.0, slot: reserve}
    - {id: port_fr1, label: PORT-F-R1, name: FWS return service port, loop: fws, edge: p_03, s: 12.0, slot: mechanical_return}
  # OUTRIG charging pads (6; the first EXTERNAL_ROBOT_COUNT are populated, in this order)
  docks:
    - {id: dock_or1, label: DOCK-OR1, name: Plant gallery pad 1, position: [-28.0, 0, -6.0], size: [1.4, 0.05, 1.8], room: room_mech}
    - {id: dock_or2, label: DOCK-OR2, name: Plant gallery pad 2, position: [-28.0, 0, -9.5], size: [1.4, 0.05, 1.8], room: room_mech}
    - {id: dock_or3, label: DOCK-OR3, name: CDU access pad, position: [-17.5, 0, 12.5], size: [1.4, 0.05, 1.8], room: room_cdu}
    - {id: dock_or4, label: DOCK-OR4, name: Hall A aisle dock, position: [-2.0, 0, -6.0], size: [1.4, 0.05, 1.8], room: hall_a}
    - {id: dock_or5, label: DOCK-OR5, name: Hall B aisle dock, position: [-2.0, 0, 6.0], size: [1.4, 0.05, 1.8], room: hall_b}
    - {id: dock_or6, label: DOCK-OR6, name: General repair and charging station, position: [6.0, 0, 0.0], size: [1.8, 0.05, 1.8], room: corridor}
  # architectural-context equipment in the mechanical room (drawn, collides, no telemetry / no hydraulic role)
  context_equipment:
    - {id: ctx_expansion, label: EXP-01, name: Expansion vessel, room: room_mech, rect: [-15.3, -15.8, -13.7, -14.2], height: 2.8}
    - {id: ctx_dosing, label: DOS-01, name: Chemical dosing skid, room: room_mech, rect: [-15.5, -9.6, -13.5, -8.4], height: 1.4}
    - {id: ctx_switchgear, label: SWG-01, name: Medium-voltage switchgear line-up, room: room_mech, rect: [-23.0, -20.5, -17.0, -19.5], height: 2.4}
  nav:
    cell_m: 0.25
    obstacles:
      - {id: obs_cdu, rect: [-22.65, 7.8, -21.35, 10.2], label: CDU-01}
      - {id: obs_cdu_pipework, rect: [-21.4, 8.3, -16.3, 9.7], label: CDU secondary pipework}
      - {id: obs_cdu_fws_pipes, rect: [-23.9, 5.2, -21.3, 7.9], label: CDU primary pipework}
      - {id: obs_tcs_pumps, rect: [-19.45, 4.4, -18.55, 6.6], label: TCS pumps}
      - {id: obs_fws_skid, rect: [-25.9, -13.4, -23.1, -9.6], label: FWS pump skid}

physics:
  seed_salt: 0x4C4B50
  dt_internal_s: 0.5            # max internal thermal step; longer dt is sub-stepped
  measurement_interval_s: 2.0   # sensors sampled on this cadence; assets()/world() are read-only views
  history_len: 450
  chiller: {supply_c: 27.0, wobble_k: 0.6, wobble_period_s: 1800.0}
  fluids:
    tcs: {kind: pg25, cp_j_kg_k: 3900.0, design_t_c: 43.0}
    fws: {kind: water, cp_j_kg_k: 4180.0, design_t_c: 31.0}
  hydraulics:
    min_resolve_interval_s: 2.0   # soft (fault-progression) re-solves are rate-limited to this
    rel_tol_resolve: 0.01         # ...and only when an effective parameter moved by >1 %
    density_resolve_rel: 0.003    # re-solve if loop fluid density drifted >0.3 % since last solve
    pipe_roughness_mm: 0.045
    foul_extent: 0.25             # a deposit occupies ~25 % of the pipe length
    cold_plate_len_m: 1.0
    solver: {max_iter: 100, tol: 1.0e-5, alpha_sequence: [1.0, 0.6, 0.35]}
    # lumped design resistances, kPa / (kg/s)^2 (same design point as the frontend reference simulator)
    k_design:
      tcs_trunk_s: 0.15
      tcs_strainer: 0.2
      tcs_hx: 0.5
      tcs_trunk_r: 0.15
      header_s: 0.6
      header_r: 0.6
      drop: 0.25          # per rack drop pipe (supply and return each)
      cold_plate: 16.0
      valve_balanced: 3.0 # at the balanced opening
      zone_valve_open: 0.05
      fws_strainer: 0.08
      fws_p01: 0.021
      fws_p02: 0.028
      fws_p03: 0.021
      fws_hx: 0.45
      fws_chiller: 0.2
    valve_balanced_opening: 0.85
    valve_min_opening: 0.02
    pumps:
      tcs: {h0_kpa: 290.0, a_kpa_per_kgs2: 1.6, speed: 0.9}
      fws: {h0_kpa: 300.0, a_kpa_per_kgs2: 0.8, speed: 0.95}
      head_health_floor: 0.5   # head multiplier = floor + (1-floor)*health
      trip_health: 0.02        # below this the pump is considered failed (no head)
  thermal:
    gpu_preset: H100_SXM
    n_chips_per_rack: 180          # representative-chip scaling: one CompOpt GPU model x N
    r_scale: 0.70                  # scales R_tile_to_coolant; calibrates chip rise to the facility design point
    power_split: {tiles: 0.78, hbm: 0.12, vrm: 0.07, pcb: 0.03}
    chip_tau_s: 6.0                # rack coolant residence-time constant at design flow
    return_tau_s: 8.0
    cdu_secondary_tau_s: 20.0
    fws_tau_s: 15.0
    ua0_w_k: 58000.0               # CDU UA at design flows (sized for the 16-rack hall)
    ua_flow_exponent: 0.3
    ua_design_flow: {tcs: 8.0, fws: 13.0}
    rack_design_flow_kg_s: 1.5     # instrumented GPU rack design flow (chip coolant-volume sizing)
    aux: {dt_k: 12.0, r_th_k_per_kw: 0.267, tau_out_s: 6.0, tau_chip_s: 20.0}   # lumped low-density racks (no CompOpt chip model)
    min_flow_kg_s: 0.01
    temp_guard_c: {min: -5.0, max: 150.0}
  workload:
    base_fraction: 0.95
    wave_amplitude: 0.04
  noise: {flow: 0.02, temp: 0.06, dp: 0.04, power: 0.6, pump_head: 0.6, vib: 0.04, bound_sigmas: 3.0}
  status:
    foul_watch: [p_10, p_12, p_17, p_22, p_27, p_20, p_02]
    pipe_dp_ratio: {watch: 1.6, warning: 2.5, critical: 5.0}
    strainer_ratio: {watch: 1.9, warning: 2.6, critical: 4.0}
    pump_vib_mm_s: {watch: 3.2, warning: 6.0}
    cdu_approach_k: {watch: 7.5, warning: 9.0}
    sensor_suspect_rel: 0.05
  faults:
    enabled: true
